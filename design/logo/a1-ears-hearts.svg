    <path d="M298 256 c-15-17-40-6-40 14 c0 18 25 31 40 46 c15-15 40-28 40-46 c0-20-25-31-40-14 Z"/>
    <!-- nose -->
    <path d="M256 338 l11 15 h-22 Z"/>
  </g>
</svg>
