  <g fill="#FFFAFA">
    <!-- ears on top lobes -->
    <path d="M176 198 L150 120 L224 172 Z"/>
    <path d="M336 198 L362 120 L288 172 Z"/>
    <!-- heart-shaped head -->
    <path d="M256 232
             C256 208 232 188 202 188
             C166 188 150 218 150 250
             C150 298 200 340 256 390
             C312 340 362 298 362 250
             C362 218 346 188 310 188
             C280 188 256 208 256 232 Z"/>
  </g>
  <g fill="#6E1423">
    <!-- small heart eyes -->
    <path d="M214 262 c-11-13-30-4-30 11 c0 14 19 24 30 35 c11-11 30-21 30-35 c0-15-19-24-30-11 Z"/>
    <path d="M298 262 c-11-13-30-4-30 11 c0 14 19 24 30 35 c11-11 30-21 30-35 c0-15-19-24-30-11 Z"/>
    <!-- nose -->
    <path d="M256 316 l8 11 h-16 Z"/>
