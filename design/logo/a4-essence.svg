<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A4 — Pure essence. No head, no ears. Heart eyes + nose + whiskers = the whole face. -->
  <rect width="512" height="512" rx="112" fill="#6E1423"/>
  <g fill="#FFFAFA">
    <!-- heart eyes -->
    <path d="M206 240 c-17-19-45-7-45 16 c0 21 28 36 45 53 c17-17 45-32 45-53 c0-23-28-35-45-16 Z"/>
    <path d="M306 240 c-17-19-45-7-45 16 c0 21 28 36 45 53 c17-17 45-32 45-53 c0-23-28-35-45-16 Z"/>
    <!-- nose -->
    <path d="M256 322 l12 16 h-24 Z"/>
  </g>
  <!-- whiskers -->
  <g stroke="#FFFAFA" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M232 350 Q150 356 110 338"/>
    <path d="M236 366 Q160 384 122 380"/>
    <path d="M280 350 Q362 356 402 338"/>
    <path d="M276 366 Q352 384 390 380"/>
  </g>
</svg>
