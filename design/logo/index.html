<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#2a2a2a;font-family:-apple-system,sans-serif;padding:40px}
  .grid{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;max-width:1100px;margin:auto}
  .card{text-align:center}
  .card img{width:300px;height:300px;display:block;border-radius:24px}
  .card span{color:#eee;font-size:18px;display:block;margin-top:12px;letter-spacing:.5px}
</style></head><body><div class="grid">
  <div class="card"><img src="v1-solid.svg"><span>V1 · Solid</span></div>
  <div class="card"><img src="v2-line.svg"><span>V2 · Line art</span></div>
  <div class="card"><img src="v3-abstract.svg"><span>V3 · Abstract</span></div>
  <div class="card"><img src="v4-kawaii.svg"><span>V4 · Kawaii</span></div>
  <div class="card"><img src="v5-geo.svg"><span>V5 · Geometric</span></div>
</div></body></html>
