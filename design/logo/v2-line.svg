<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- V2 — Thin line art. One continuous outline, filled heart eyes. Elegant. -->
  <rect width="512" height="512" rx="112" fill="#6E1423"/>
  <g fill="none" stroke="#FFFAFA" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- head + ears as one path -->
    <path d="M168 196
             L150 132 L214 178
             a118 118 0 0 1 84 0
             L362 132 L344 196
             a118 118 0 1 1 -176 0 Z"/>
    <!-- whiskers -->
    <path d="M150 300 H92 M150 322 H100"/>
    <path d="M362 300 H420 M362 322 H412"/>
  </g>
  <g fill="#FFFAFA">
    <!-- heart eyes -->
    <path d="M214 268 c-14-16-38-6-38 13 c0 17 24 30 38 44 c14-14 38-27 38-44 c0-19-24-29-38-13 Z"/>
    <path d="M298 268 c-14-16-38-6-38 13 c0 17 24 30 38 44 c14-14 38-27 38-44 c0-19-24-29-38-13 Z"/>
    <!-- nose + smile -->
    <path d="M256 322 l9 12 h-18 Z"/>
  </g>
  <path d="M240 344 q16 14 32 0" fill="none" stroke="#FFFAFA" stroke-width="10" stroke-linecap="round"/>
</svg>
