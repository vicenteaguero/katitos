    <!-- two ears -->
    <path d="M176 196 L150 120 L226 172 Z"/>
    <path d="M336 196 L362 120 L286 172 Z"/>
    <!-- big heart eyes -->
    <path d="M206 236 c-20-23-54-8-54 19 c0 24 34 42 54 62 c20-20 54-38 54-62 c0-27-34-42-54-19 Z"/>
    <path d="M306 236 c-20-23-54-8-54 19 c0 24 34 42 54 62 c20-20 54-38 54-62 c0-27-34-42-54-19 Z"/>
    <!-- tiny nose dot -->
    <circle cx="256" cy="350" r="9"/>
  </g>
</svg>
