<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- V4 — Chubby kawaii. Round cheeks, whiskers, heart eyes, smile. Friendly. -->
  <rect width="512" height="512" rx="112" fill="#6E1423"/>
  <g fill="#FFFAFA">
    <!-- ears -->
    <path d="M158 168 L150 116 L210 156 Z"/>
    <path d="M354 168 L362 116 L302 156 Z"/>
    <!-- wide chubby head -->
    <ellipse cx="256" cy="296" rx="130" ry="112"/>
  </g>
  <g fill="#6E1423">
    <!-- heart eyes -->
    <path d="M212 276 c-12-14-33-5-33 11 c0 15 21 26 33 38 c12-12 33-23 33-38 c0-16-21-25-33-11 Z"/>
    <path d="M300 276 c-12-14-33-5-33 11 c0 15 21 26 33 38 c12-12 33-23 33-38 c0-16-21-25-33-11 Z"/>
    <!-- nose -->
    <path d="M256 318 l8 11 h-16 Z"/>
    <!-- smile (w shape) -->
    <path d="M230 332 q13 16 26 2 q13 14 26 -2" fill="none" stroke="#6E1423" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- blush cheeks -->
  <g fill="#C9485B" opacity="0.6">
    <ellipse cx="172" cy="320" rx="20" ry="13"/>
    <ellipse cx="340" cy="320" rx="20" ry="13"/>
  </g>
  <!-- whiskers -->
  <g stroke="#FFFAFA" stroke-width="9" stroke-linecap="round">
    <path d="M126 300 H86 M130 326 H96"/>
    <path d="M386 300 H426 M382 326 H416"/>
  </g>
</svg>
