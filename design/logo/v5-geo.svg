<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- V5 — Geometric / angular. Hex-ish head, sharp ears, flat heart eyes. Modern brand mark. -->
  <rect width="512" height="512" rx="112" fill="#6E1423"/>
  <g fill="#FFFAFA">
    <!-- angular head with built-in ears (one polygon) -->
    <path d="M256 160
             L150 140 L172 214
             L156 300 L256 392
             L356 300 L340 214
             L362 140 Z"/>
  </g>
  <g fill="#6E1423">
    <!-- flat heart eyes -->
    <path d="M214 262 c-13-15-35-5-35 12 c0 16 22 27 35 40 c13-13 35-24 35-40 c0-17-22-27-35-12 Z"/>
    <path d="M298 262 c-13-15-35-5-35 12 c0 16 22 27 35 40 c13-13 35-24 35-40 c0-17-22-27-35-12 Z"/>
    <!-- nose -->
    <path d="M256 312 l9 12 h-18 Z"/>
    <!-- minimal mouth line -->
    <path d="M256 324 V340" stroke="#6E1423" stroke-width="8"/>
  </g>
</svg>
