<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100408" />
    <!-- Fonts are self-hosted via @fontsource (imported in main.tsx) — no
         render-blocking third-party request, and they work offline. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" (opaque): per Apple's docs the web view renders BELOW the status
         bar and fills down to the home indicator — deterministic, no empty band.
         (black-translucent is deprecated + flaky on iOS 16-18 and produced a
         shorter, mis-placed viewport.) NOTE: iOS snapshots this value at
         "Add to Home Screen" — changing it needs a delete + re-add to take. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Katitos" />
    <!-- iOS launch screens — kill the white flash on cold standalone launch. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash/iphone13.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash/iphone17promax.png"
    />
    <title>Katitos</title>
    <!-- Dark base so a cold launch never flashes white before anything paints. -->
    <style>
      html,
      body {
        margin: 0;
        background: #100408;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Instant boot splash: paints before any JS so launch never flashes black/home.
         Matches the in-app splash; main.tsx fades it out once React has painted. -->
    <div id="boot" style="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 70% at 50% 40%,rgba(110,20,35,.35),transparent 70%),linear-gradient(168deg,#1a0b13 0%,#100408 60%,#0b0306 100%);transition:opacity .35s ease">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <span style="position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(228,195,106,.28),transparent 65%);transform:translateY(-22px)"></span>
        <svg width="104" height="104" viewBox="0 0 1024 1024" style="position:relative"><g transform="translate(0.5,31)"><g transform="translate(0,1024) scale(0.1,-0.1)" fill="#FFFAFA"><path d="M3114 7595 c-30 -46 -102 -296 -120 -416 -20 -139 -15 -362 12 -521 18 -107 18 -107 -27 -165 -415 -533 -541 -1252 -338 -1932 154 -517 475 -876 971 -1089 254 -108 597 -186 993 -224 185 -17 861 -18 1045 0 182 17 477 67 615 103 806 209 1249 672 1396 1460 30 158 33 192 33 369 1 208 -10 315 -51 500 -64 290 -191 563 -370 797 -55 73 -55 73 -33 205 43 259 23 518 -60 770 -53 165 -58 171 -124 163 -278 -35 -635 -183 -889 -367 -69 -49 -69 -49 -235 -9 -370 89 -715 114 -1132 80 -168 -13 -317 -38 -506 -84 -147 -36 -147 -36 -203 4 -260 188 -631 342 -904 376 -52 7 -56 6 -73 -20z m559 -1955 c71 -11 170 -60 220 -108 21 -21 56 -63 77 -96 38 -58 38 -58 59 -19 34 67 114 147 183 181 168 85 356 56 484 -75 98 -100 140 -216 132 -365 -4 -72 -10 -97 -41 -163 -49 -101 -106 -166 -306 -344 -91 -81 -236 -216 -321 -299 l-155 -151 -135 133 c-74 72 -198 187 -275 255 -345 306 -401 384 -412 577 -10 171 60 322 190 408 101 67 184 85 300 66z m2238 0 c116 -22 219 -94 290 -202 37 -58 37 -58 53 -33 9 13 16 29 16 34 0 5 24 36 54 69 210 226 558 169 694 -115 36 -77 37 -80 37 -198 0 -120 0 -120 -42 -207 -48 -99 -116 -173 -378 -408 -82 -74 -206 -190 -275 -257 l-125 -122 -160 157 c-88 86 -231 220 -319 297 -169 149 -252 239 -290 313 -96 190 -66 409 76 555 100 101 231 143 369 117z"/></g></g></svg>
        <span style="position:relative;font-family:Georgia,'Times New Roman',serif;font-size:1.7rem;font-weight:600;letter-spacing:.06em;color:#fbf5f0">Katitos</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
