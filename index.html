<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100408" />
    <!-- Fonts are self-hosted via @fontsource (imported in main.tsx) — no
         render-blocking third-party request, and they work offline. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" (opaque): per Apple's docs the web view renders BELOW the status
         bar and fills down to the home indicator — deterministic, no empty band.
         (black-translucent is deprecated + flaky on iOS 16-18 and produced a
         shorter, mis-placed viewport.) NOTE: iOS snapshots this value at
         "Add to Home Screen" — changing it needs a delete + re-add to take. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Katitos" />
    <!-- iOS launch screens — kill the white flash on cold standalone launch. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash/iphone13.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash/iphone17promax.png"
    />
    <title>Katitos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
